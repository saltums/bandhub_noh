<style>
  html,body{margin:0;height:100%;background:#0b1026;overflow:hidden;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;justify-content:center}
  #stage{position:relative;width:100%;max-width:480px;height:100%;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(10px + env(safe-area-inset-top)) 14px 0;color:#fff;font-weight:900;text-shadow:0 2px 6px rgba(0,0,0,.6);pointer-events:none}
  .hud .big{font-size:34px;line-height:1}
  .hud small{display:block;font-size:11px;opacity:.8;font-weight:700}
  .back{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;color:#fff;background:rgba(0,0,0,.45);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;text-decoration:none}
  .panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;gap:10px;background:rgba(10,8,40,.78);color:#fff;text-align:center;padding:20px;z-index:4}
  .panel h1{margin:0;font-size:26px;letter-spacing:.02em}
  .panel h1 span{color:#c4b5fd}
  .btn{background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;border:0;border-radius:999px;padding:14px 38px;font-size:20px;font-weight:900;box-shadow:0 8px 24px rgba(124,58,237,.5)}
  .btn:active{transform:scale(.96)}
  input{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;padding:10px 14px;font-size:16px;text-align:center;width:200px}
  .rank{width:100%;max-width:300px;background:rgba(255,255,255,.08);border-radius:14px;padding:8px 14px;font-size:14px;text-align:left}
  .rank div{display:flex;justify-content:space-between;padding:3px 0}
  .rank b{color:#fde68a}
  .panel>:first-child{margin-top:auto}.panel>:last-child{margin-bottom:auto}
  .legend{width:100%;max-width:330px;background:rgba(255,255,255,.08);border-radius:14px;padding:10px 12px;text-align:left;font-size:12.5px;line-height:1.35}
  .legend h2{margin:0 0 6px;font-size:12px;opacity:.7;font-weight:700;letter-spacing:.04em}
  .legend .row{display:flex;align-items:center;gap:10px;padding:3px 0}
  .legend .row img{width:28px;height:32px;object-fit:contain;flex:none}
  .legend .good{color:#fde68a}.legend .bad{color:#fca5a5}
  .hide{display:none!important}
  .res{font-size:56px;font-weight:900;line-height:1;color:#fde68a;text-shadow:0 4px 18px rgba(219,39,119,.6)}
  .msg{font-size:13px;opacity:.85}
</style>

  if(d>90){ctx.globalAlpha=Math.min(.35,(d-90)/200);ctx.fillStyle='#ef4444';ctx.fillRect(0,0,14,H);ctx.fillStyle='#a855f7';ctx.fillRect(W-14,0,14,H);ctx.globalAlpha=1}
  // depth markers every 10m
  const dy=H*.34;ctx.fillStyle='rgba(255,255,255,.35)';ctx.font='bold 11px sans-serif';ctx.textAlign='left';
  for(let m=Math.floor(d/10)*10;m<d+40;m+=10){const y=dy+(m-d)*PXM;if(m>0){ctx.fillRect(0,y,18,2);ctx.fillText(m+'m',22,y+4)}}
  S.objs.forEach(o=>{const im=IMG[o.k];if(!im.complete)return;
    if(o.type==='item'){
      const bob=Math.sin(S.time*5+o.d)*4, pr=1+Math.sin(S.time*7+o.d)*.12, bad=o.k==='item_bad';
      const gr=ctx.createRadialGradient(o.x,o.y+bob,2,o.x,o.y+bob,34*pr);
      gr.addColorStop(0,bad?'rgba(248,113,113,.55)':'rgba(253,224,71,.85)');gr.addColorStop(1,'rgba(253,224,71,0)');
      ctx.fillStyle=gr;ctx.beginPath();ctx.arc(o.x,o.y+bob,36*pr,0,7);ctx.fill();
      ctx.save();ctx.translate(o.x,o.y+bob);ctx.scale(pr,pr);ctx.drawImage(im,-o.w/2,-o.h/2,o.w,o.h);ctx.restore();
      if(!bad){ctx.fillStyle='#fff';const a=S.time*3+o.d;for(let i=0;i<3;i++){const aa=a+i*2.1;ctx.fillRect(o.x+Math.cos(aa)*26-1.5,o.y+bob+Math.sin(aa)*26-1.5,3,3)}}
    } else {
      const warn=o.y<(H*.34+260)&&o.y>H*.34-40;
      ctx.save();ctx.shadowColor='#ef4444';ctx.shadowBlur=warn?14+Math.sin(S.time*14)*8:6;
      ctx.drawImage(im,o.x-o.w/2,o.y-o.h/2,o.w,o.h);ctx.restore();
      if(warn){ctx.fillStyle='#fca5a5';ctx.font='900 14px sans-serif';ctx.textAlign='center';ctx.fillText('⚠',o.x,o.y-o.h/2-6)}
    }});
  S.spark.forEach(p=>{ctx.globalAlpha=1-p.t/.6;ctx.fillStyle='#fde68a';ctx.fillRect(p.x-2,p.y-2,4,4)});ctx.globalAlpha=1;
  // diver
  const x=S.dx, y=dy, im=IMG.diver0, w=118, h=w*365/300;
  if(Math.abs(S.tx-S.dx)>14)face=S.tx>S.dx?1:-1;
  if(!(S.inv>0&&Math.floor(S.time*20)%2)&&im.complete){
    ctx.save();ctx.translate(x,y);ctx.scale(face,1);
    ctx.rotate(Math.max(-.35,Math.min(.35,(S.tx-S.dx)*face*.004))+Math.sin(S.time*5)*.03);
    if(state==='outro'){const o=S.outro,e0=Math.min(1,o.t/.5),ez=e0*e0*(3-2*e0),ph=o.t/.2,bt=Math.abs(Math.sin(ph*Math.PI)),fin=o.dur-o.t<.75;
      ctx.translate(Math.sin(o.t*4.5)*14,-bt*16);
      ctx.rotate(Math.PI*ez+Math.sin(ph*Math.PI)*.22*ez+(fin?(1-(o.dur-o.t)/.75)*Math.PI*2:0));       // 頭を上に向けて、ビートに合わせてヘッドバンギング
      const sc=fin?1+(1-(o.dur-o.t)/.75)*.25:1;ctx.scale(sc*(1+bt*.05),sc*(1-bt*.07))}
    ctx.imageSmoothingEnabled=true;
    ctx.shadowColor=S.dbl>0?'#f472b6':'rgba(125,211,252,.9)';ctx.shadowBlur=S.dbl>0?22:9;
    ctx.drawImage(im,-w*.55,-h*.5,w,h);
    ctx.restore();
  }
  if(state==='outro'&&S.notes){ctx.save();ctx.textAlign='center';ctx.font='900 26px sans-serif';S.notes.forEach(n=>{ctx.globalAlpha=Math.max(0,1-n.t/1.6);ctx.fillStyle='#fde68a';ctx.fillText(n.ch,n.x,n.y)});ctx.restore();
    const o=S.outro,g=ctx.createRadialGradient(S.dx,H*.34,10,S.dx,H*.34,160+Math.sin(o.t*20)*12);g.addColorStop(0,'rgba(180,230,255,.25)');g.addColorStop(1,'rgba(125,211,252,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.save();ctx.globalAlpha=Math.min(1,o.t*2);ctx.textAlign='center';ctx.font='700 13px sans-serif';ctx.fillStyle='#fff';ctx.fillText('タップでスキップ',W/2,H-86);ctx.restore()}
  // popups
  ctx.textAlign='center';ctx.font='900 16px sans-serif';
  S.pop.forEach(p=>{ctx.globalAlpha=1-p.t/1.1;ctx.fillStyle='#000';ctx.fillText(p.txt,p.x+1,p.y-p.t*40+1);ctx.fillStyle=p.col;ctx.fillText(p.txt,p.x,p.y-p.t*40)});ctx.globalAlpha=1;
  if(S.combo>=2){ctx.fillStyle='#fde68a';ctx.font='900 20px sans-serif';ctx.textAlign='center';ctx.fillText('COMBO x'+S.combo,W/2,H-60)}
  if(S.dbl>0){ctx.fillStyle='rgba(244,114,182,.9)';ctx.font='900 14px sans-serif';ctx.fillText('★ DOUBLE '+S.dbl.toFixed(1)+'s',W/2,H-24)}
  if(S.rush>0){const p=S.rush/S.rushT;
    ctx.save();ctx.globalCompositeOperation='lighter';
    const g=ctx.createRadialGradient(W/2,H*.34,20,W/2,H*.34,H*.8);g.addColorStop(0,'rgba(253,224,71,'+(.28*p)+')');g.addColorStop(1,'rgba(251,146,60,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(255,243,176,'+(.25+.3*p)+')';ctx.lineWidth=2;
    for(let n=0;n<26;n++){const x=(n*97.3+S.time*13)%W,l=90+((n*53)%140),y=((S.time*1400+n*211)%(H+l))-l;ctx.beginPath();ctx.moveTo(x,H-y);ctx.lineTo(x,H-y-l);ctx.stroke()}
    ctx.restore();
    if((S.rushAge||0)<.1){ctx.fillStyle='rgba(255,250,200,'+(1-(S.rushAge||0)/.1)*.55+')';ctx.fillRect(0,0,W,H)}
    ctx.save();ctx.textAlign='center';ctx.font='900 '+(34+Math.sin(S.time*30)*3)+'px sans-serif';ctx.lineWidth=5;ctx.strokeStyle='#7c2d12';ctx.fillStyle='#fde047';ctx.globalAlpha=Math.min(1,p*2);
    if(!S.stream){ctx.strokeText('GOLD DIVE!!',W/2,H*.62);ctx.fillText('GOLD DIVE!!',W/2,H*.62)}ctx.restore()}
  if(S.stream){const g=ctx.createLinearGradient(0,0,W,0),a=.25+.1*Math.sin(S.time*14);g.addColorStop(0,'rgba(253,224,71,'+a+')');g.addColorStop(.18,'rgba(253,224,71,0)');g.addColorStop(.82,'rgba(253,224,71,0)');g.addColorStop(1,'rgba(253,224,71,'+a+')');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  if(S.stream){const st=S.stream,fr=Math.max(0,st.rt/RTMAX),low=st.rt<.8,bw=Math.min(240,W*.6),bx=(W-bw)/2,by=78;
    ctx.save();ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(bx-3,by-3,bw+6,16);ctx.fillStyle=low?(Math.sin(S.time*30)>0?'#ef4444':'#fca5a5'):'#fde047';ctx.fillRect(bx,by,bw*fr,10);
    ctx.textAlign='center';ctx.font='900 11px sans-serif';ctx.fillStyle='#fff';ctx.fillText('RUSH TIME '+st.rt.toFixed(1),W/2,by-8);ctx.restore()}
  if(S.stream){const st=S.stream,sc=1+(S.bump||0)*2.5;S.bump=Math.max(0,(S.bump||0)-.016);
    ctx.save();ctx.textAlign='center';ctx.translate(W/2,H*.62);ctx.scale(sc,sc);ctx.font='900 46px sans-serif';ctx.lineWidth=7;ctx.strokeStyle='#7c2d12';ctx.fillStyle='#fde047';
    ctx.strokeText('GOLD x'+st.got,0,0);ctx.fillText('GOLD x'+st.got,0,0);ctx.restore();
    if(st.age<2.4){ctx.save();ctx.textAlign='center';ctx.globalAlpha=Math.min(1,(2.4-st.age));ctx.font='900 18px sans-serif';ctx.fillStyle='#fff';ctx.fillText('どこまで続く……?',W/2,H*.7);ctx.restore()}}
  if(flashNow){flashNow=false;S.flashA=.7}
  if(S.flashA>0){ctx.fillStyle='rgba(255,250,200,'+S.flashA+')';ctx.fillRect(0,0,W,H);S.flashA=Math.max(0,S.flashA-.05)}
  ctx.restore();
}
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(state==='play')update(dt);else if(state==='outro')outroTick(dt);
  draw();requestAnimationFrame(loop)
}
async function api(path,opt){const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,Object.assign({headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'}},opt));if(!r.ok)throw new Error(r.status);return r}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function ranking(el,mine){
  el.innerHTML='<div><span>ランキング読み込み中…</span></div>';
  try{
    const rows=await (await api('game_scores?select=name,depth&order=depth.desc&limit=200')).json();
    const best=new Map();rows.forEach(r=>{if(!best.has(r.name))best.set(r.name,Number(r.depth))});
    const top=[...best.entries()].slice(0,8);
    el.innerHTML='<div style="opacity:.7;font-size:12px"><span>🏆 メンバーランキング(各自のベスト)</span></div>'+(top.map((r,i)=>'<div'+(r[0]===mine?' style="color:#fde68a"':'')+'><span>'+(i+1)+'. '+esc(r[0])+'</span><b>'+r[1].toFixed(0)+'m</b></div>').join('')||'<div><span>まだ記録がありません</span></div>');
  }catch(e){el.innerHTML='<div><span>ランキングを取得できませんでした</span></div>'}
}
function myName(){return ($('nm').value||'').trim().slice(0,12)}
function bestLocal(){return Number(localStorage.getItem('bh_game_best')||0)}
function beginRun(){reset();S.goldRate=GOLD_RATE;S.rushRun=Math.random()<RUSH_CHANCE;S.streamAt=2.2;if(S.rushRun){popText('ゴールドの気配…',W/2,H*.55,'#fde047');S.pop[0].t=-.8}state='play';openStop();bgmStop();bgmStart()}
function startGame(){audioOn();
  const n=myName();if(!n){$('nm').focus();$('nm').style.borderColor='#f87171';return}
  try{localStorage.setItem('bh_game_name',n)}catch(e){}
  beginRun();$('start').classList.add('hide');$('end').classList.add('hide');$('hud').classList.remove('hide');
}
// ---- タイムアップ後: その場でベースを弾く ----
function startOutro(){if(state!=='play')return;state='outro';bgmStop();
  const dur=3.4+Math.min(2.2,S.depth/500);S.outro={t:0,dur,k:0};S.notes=[];S.inv=0;
  S.nextStep=0;popText('TIME UP!',W/2,H*.3,'#fde047');
  if(AC&&!muted){const steps=Math.floor((dur-.5)/.2);for(let k=0;k<steps;k++)setTimeout(()=>{if(state!=='outro')return;const f=RIFF[k%RIFF.length];tone(f,.26,'sawtooth',.24,f*.85);tone(f*2,.1,'triangle',.05,f*2.6);if(k%2===0)tone(f/2,.3,'sine',.2);S.outro.hit=1},k*200+300);
    setTimeout(()=>{if(state!=='outro')return;[82.4,123.5,164.8,247].forEach(f=>tone(f,1.3,'sawtooth',.26,f*.8));tone(41.2,1.4,'sine',.3);S.outro.last=1;S.flashA=.7;S.shake=.8},(dur-.7)*1000)}
  else setTimeout(()=>{if(state==='outro')S.outro.last=1},(dur-.7)*1000)}
function outroTick(dt){const o=S.outro;o.t+=dt;S.time+=dt;S.v+=(0-S.v)*Math.min(1,dt*6);
  if(S.shake>0)S.shake-=dt;
  if(o.hit){o.hit=0;S.shake=Math.max(S.shake,.08);S.notes.push({x:S.dx+(Math.random()-.5)*40,y:H*.34-20,vx:(Math.random()-.5)*60,vy:-70-Math.random()*60,t:0,ch:Math.random()<.5?'♪':'♫'})}
  S.notes.forEach(n=>{n.t+=dt;n.x+=n.vx*dt;n.y+=n.vy*dt});S.notes=S.notes.filter(n=>n.t<1.6);
  S.pop.forEach(p=>p.t+=dt);S.pop=S.pop.filter(p=>p.t<1.4);S.spark.forEach(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt});S.spark=S.spark.filter(p=>p.t<.6);
  if(S.flashA>0)S.flashA=Math.max(0,S.flashA-dt*1.2);
  if(o.t>=o.dur)finishOutro()}
function finishOutro(){if(state!=='outro')return;endGame()}
async function endGame(){
  state='over';bgmStop();const depth=Math.min(DEPTH_MAX,Math.floor(S.depth*10)/10);
  $('fin').textContent=Math.floor(depth);
  let nb=false;const b=bestLocal();if(depth>b){nb=true;try{localStorage.setItem('bh_game_best',String(depth))}catch(e){}}
  $('endmsg').textContent=depth>=DEPTH_MAX?'🏆 400m 到達！ 海底に着いた！':nb?'🎉 自己ベスト更新！':'タイムアップ！';
  $('best').textContent='自己ベスト '+Math.floor(Math.max(b,depth))+'m ／ アイテム '+S.items+'個 ／ 最大コンボ '+S.maxCombo+'';
  $('end').classList.remove('hide');
  const n=myName();
  try{await api('game_scores',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({name:n,depth})})}catch(e){}
  ranking($('rk2'),n);
}
function setTx(e){if(state!=='play')return;const r=cv.getBoundingClientRect();S.tx=Math.max(24,Math.min(W-24,e.clientX-r.left))}
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='outro'&&S.outro.t>1.2){finishOutro();return}try{cv.setPointerCapture(e.pointerId)}catch(_){}setTx(e)});
cv.addEventListener('pointermove',e=>{e.preventDefault();setTx(e)});
addEventListener('keydown',e=>{if(state!=='play')return;const st=W*.12;if(e.code==='ArrowLeft')S.tx=Math.max(24,S.tx-st);if(e.code==='ArrowRight')S.tx=Math.min(W-24,S.tx+st)});
$('mute').addEventListener('click',()=>{muted=!muted;if(bgm)bgm.out.gain.value=muted?0:1;if(op)op.out.gain.value=muted?0:1;$('mute').textContent=muted?'🔇':'🔊'});
$('go').addEventListener('click',startGame);
$('again').addEventListener('click',()=>{audioOn();$('end').classList.add('hide');beginRun()});
try{$('nm').value=localStorage.getItem('bh_game_name')||''}catch(e){}
$('nm').addEventListener('keydown',e=>{if(e.key==='Enter')startGame()});

(function(){
  const rows=[
    ['h','✨ 光るもの = 取る'],
    ['item_gold','good','ゴールドベース(超レア!)','一気に +100m ＆ +3秒。たまに大量出現の回も!'],
    ['item_tank','good','酸素ボンベ','+12m 一気に潜る'],
    ['item_string','good','ベースの弦','+4m'],
    ['item_star','good','ステージダイブ','4秒間、2倍の速さ'],
    ['item_clock','good','時計','残り時間 +2秒(取るほど増え幅は減る/最大30秒)'],
    ['h','⚠ 赤い枠 = よける'],
    ['item_bad','bad','ハウリング(赤い×)','取ると -6m・減速'],
    ['ob_amp','bad','アンプ・スピーカー・ケーブル','ぶつかると -4m・減速'],
    ['h','🎸 ボーナス'],
    ['item_string','good','連続で取る = コンボ','ベースの音階が上がる! 3つ目から追加ボーナス']
  ];
  const el=document.getElementById('lg');
  const src=k=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(SPRITES[k]);
  el.innerHTML='<h2>アイテムの説明</h2>'+rows.map(r=>r[0]==='h'?'<div style="margin-top:6px;font-weight:900">'+r[1]+'</div>':'<div class="row"><img src="'+src(r[0])+'" alt=""><div><b class="'+r[1]+'">'+r[2]+'</b><br><span style="opacity:.85">'+r[3]+'</span></div></div>').join('');
})();
reset();state='idle';ranking($('rk1'),myName());
requestAnimationFrame(loop);
</script>
