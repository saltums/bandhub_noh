<style>
  html,body{margin:0;height:100%;background:#0b1026;overflow:hidden;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

  .hud small{display:block;font-size:11px;opacity:.8;font-weight:700}

  .panel h1 span{color:#c4b5fd}
  .btn{background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;border:0;border-radius:999px;padding:14px 38px;font-size:20px;font-weight:900;box-shadow:0 8px 24px rgba(124,58,237,.5)}

  input{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;padding:10px 14px;font-size:16px;text-align:center;width:200px}
  .rank{width:100%;max-width:300px;background:rgba(255,255,255,.08);border-radius:14px;padding:8px 14px;font-size:14px;text-align:left}
  .rank div{display:flex;justify-content:space-between;padding:3px 0}
  .rank b{color:#fde68a}
  .panel>:first-child{margin-top:auto}.panel>:last-child{margin-bottom:auto}
  .legend{width:100%;max-width:330px;background:rgba(255,255,255,.08);border-radius:14px;padding:10px 12px;text-align:left;font-size:12.5px;line-height:1.35}
  .legend h2{margin:0 0 6px;font-size:12px;opacity:.7;font-weight:700;letter-spacing:.04em}
  .legend .row{display:flex;align-items:center;gap:10px;padding:3px 0}
  .legend .row img{width:28px;height:32px;object-fit:contain;flex:none}
  .legend .good{color:#fde68a}.legend .bad{color:#fca5a5}
  .hide{display:none!important}
  .res{font-size:56px;font-weight:900;line-height:1;color:#fde68a;text-shadow:0 4px 18px rgba(219,39,119,.6)}
  .msg{font-size:13px;opacity:.85}
</style>

function tone(f,dur,type,vol,cut){if(!AC||muted)return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();o.type=type||'sawtooth';o.frequency.value=f;fl.type='lowpass';fl.frequency.setValueAtTime(cut||900,t);fl.frequency.exponentialRampToValueAtTime(180,t+dur);g.gain.setValueAtTime(vol||.28,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(fl);fl.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noteUp(i){const f=NOTES[Math.min(i,NOTES.length-1)];tone(f*2,.32,'sawtooth',.26,1400);tone(f*4,.12,'triangle',.07,2400)}
function thud(){tone(55,.25,'square',.3,300);tone(40,.35,'sawtooth',.25,200)}

const LIMIT=15, PXM=26;
const ITEM_KINDS=[{k:'item_tank',w:3,m:'酸素ボンベ！ +12m'},{k:'item_string',w:4,m:'弦ゲット +4m'},{k:'item_star',w:2,m:'ステージダイブ！ 4秒ダブル'},{k:'item_clock',w:2,m:'時計 +2秒'},{k:'item_bad',w:3,m:'ハウリング… 浮かされた'}];

function reset(){S={t:LIMIT,depth:0,v:0,time:0,objs:[],nextSpawn:6,bubbles:[],dbl:0,inv:0,slow:0,pop:[],shake:0,items:0,combo:0,maxCombo:0,near:0,spark:[],tx:W/2,dx:W/2};
  for(let i=0;i<22;i++)S.bubbles.push({x:Math.random()*W,y:Math.random()*H,r:2+Math.random()*5,s:10+Math.random()*30})}
function pickItem(){const tot=ITEM_KINDS.reduce((a,b)=>a+b.w,0);let r=Math.random()*tot;for(const it of ITEM_KINDS){if((r-=it.w)<=0)return it}return ITEM_KINDS[0]}
function spawn(){
  const x=W*(.12+Math.random()*.76);
  if(Math.random()<.42){const it=pickItem();S.objs.push({type:'item',it,k:it.k,x,d:S.depth+34,w:it.k==='item_string'?38:34,h:it.k==='item_string'?45:34})}
  else{const o=OBS[Math.floor(Math.random()*OBS.length)];S.objs.push({type:'ob',k:o.k,x,d:S.depth+34,w:o.w,h:o.h})}
  S.nextSpawn=S.depth+34+ (4+Math.random()*7);
}
function popText(txt,x,y,col){S.pop.push({txt,x,y,t:0,col:col||'#fde68a'})}
function update(dt){
  S.time+=dt;S.t-=dt;if(S.t<=0){S.t=0;endGame();return}
  let vt=5+S.time*.18;if(S.dbl>0)vt*=2;if(S.slow>0)vt*=.3;
  S.v+=(vt-S.v)*Math.min(1,dt*4);
  S.depth=Math.max(0,S.depth+S.v*dt);
  S.dx+=(S.tx-S.dx)*Math.min(1,dt*10);
  if(S.slow>0)S.slow-=dt;if(S.dbl>0)S.dbl-=dt;if(S.inv>0)S.inv-=dt;if(S.shake>0)S.shake-=dt;
  while(S.nextSpawn<S.depth+36&&S.objs.length<30)spawn();
  const dx=S.dx, dy=H*.34;
  for(let i=S.objs.length-1;i>=0;i--){
    const o=S.objs[i];const y=dy+(o.d-S.depth)*PXM;o.y=y;
    if(y<-120){S.objs.splice(i,1);continue}
    if(o.hit)continue;
    if(o.type==='ob'&&!o.passed&&y>dy+(o.h+40)/2*.7){o.passed=true;const gap=Math.abs(o.x-dx),lim=(o.w+60)/2*.7;if(gap>=lim&&gap<lim+26){S.depth+=3;S.near++;blip();popText('ギリギリ！ +3m',dx,dy-62,'#fef08a')}}
    const hw=(o.w+60)/2*.7, hh=(o.h+60)/2*.7;
    if(Math.abs(o.x-dx)<hw&&Math.abs(y-dy)<hh){
      if(o.type==='item'){o.hit=true;S.objs.splice(i,1);applyItem(o,dx,dy)}
      else if(S.inv<=0){S.inv=1;S.slow=.9;S.shake=.3;S.depth=Math.max(0,S.depth-4);S.combo=0;thud();buzz(80);popText('ガツン！ -4m',dx,dy-40,'#fca5a5')}
    }
  }
  S.spark.forEach(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt});S.spark=S.spark.filter(p=>p.t<.6);S.pop.forEach(p=>p.t+=dt);S.pop=S.pop.filter(p=>p.t<1.1);
  S.bubbles.forEach(b=>{b.y-=b.s*dt*(1+S.v*.25);if(b.y<-10){b.y=H+10;b.x=Math.random()*W}});
  $('tm').textContent=S.t.toFixed(1);$('dp').textContent=Math.floor(S.depth);
}
function applyItem(o,x,y){
  const k=o.k;S.items++;
  const sparkle=()=>{for(let i=0;i<10;i++){const a=Math.random()*6.28;S.spark.push({x,y,vx:Math.cos(a)*(40+Math.random()*80),vy:Math.sin(a)*(40+Math.random()*80),t:0})}};
  if(k==='item_bad'){S.depth=Math.max(0,S.depth-6);S.slow=.9;S.shake=.25;S.combo=0;thud();buzz(80);popText('ハウリング… -6m',x,y-40,'#fca5a5');return}
  sparkle();noteUp(S.combo);S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);buzz(15);
  const cb=S.combo>=3?Math.min(S.combo-2,5):0;S.depth+=cb;
  const cbTxt=S.combo>=2?'  COMBO x'+S.combo+(cb?' +'+cb+'m':''):'';
  if(k==='item_tank'){S.depth+=12;popText('酸素ボンベ！ +12m'+cbTxt,x,y-40)}
  else if(k==='item_string'){S.depth+=4;popText('弦ゲット +4m'+cbTxt,x,y-40)}
  else if(k==='item_star'){S.dbl=4;popText('ステージダイブ！ 4秒ダブル'+cbTxt,x,y-40,'#f9a8d4')}
  else if(k==='item_clock'){S.t+=2;popText('時計 +2秒'+cbTxt,x,y-40,'#a7f3d0')}
}
function bgColors(d){
  const stops=[[0,[56,189,248],[14,116,144]],[40,[14,116,144],[12,74,110]],[90,[30,27,75],[49,22,110]],[150,[76,29,149],[127,29,29]]];
  let a=stops[0],b=stops[stops.length-1];
  for(let i=0;i<stops.length-1;i++)if(d>=stops[i][0]&&d<stops[i+1][0]){a=stops[i];b=stops[i+1];var f=(d-a[0])/(b[0]-a[0]);return mix(a,b,f)}
  return [`rgb(${b[1]})`,`rgb(${b[2]})`];
}
function mix(a,b,f){const m=(p,q)=>p.map((v,i)=>Math.round(v+(q[i]-v)*f)).join(',');return [`rgb(${m(a[1],b[1])})`,`rgb(${m(a[2],b[2])})`]}
function draw(){
  const d=S?S.depth:0;const [c1,c2]=bgColors(d);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(!S)return;
  ctx.save();if(S.shake>0)ctx.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
  // light rays near the top
  if(d<60){ctx.globalAlpha=Math.max(0,.25-d/260);ctx.fillStyle='#fff';for(let i=0;i<4;i++){ctx.beginPath();const x=W*(.1+i*.27);ctx.moveTo(x,0);ctx.lineTo(x+40,0);ctx.lineTo(x+120,H);ctx.lineTo(x+40,H);ctx.fill()}ctx.globalAlpha=1}
  ctx.fillStyle='rgba(224,242,254,.35)';S.bubbles.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()});
  // neon stage lights deep down
  if(d>90){ctx.globalAlpha=Math.min(.35,(d-90)/200);ctx.fillStyle='#ef4444';ctx.fillRect(0,0,14,H);ctx.fillStyle='#a855f7';ctx.fillRect(W-14,0,14,H);ctx.globalAlpha=1}
  // depth markers every 10m
  const dy=H*.34;ctx.fillStyle='rgba(255,255,255,.35)';ctx.font='bold 11px sans-serif';ctx.textAlign='left';
  for(let m=Math.floor(d/10)*10;m<d+40;m+=10){const y=dy+(m-d)*PXM;if(m>0){ctx.fillRect(0,y,18,2);ctx.fillText(m+'m',22,y+4)}}
  S.objs.forEach(o=>{const im=IMG[o.k];if(!im.complete)return;
    if(o.type==='item'){
      const bob=Math.sin(S.time*5+o.d)*4, pr=1+Math.sin(S.time*7+o.d)*.12, bad=o.k==='item_bad';
      const gr=ctx.createRadialGradient(o.x,o.y+bob,2,o.x,o.y+bob,34*pr);
      gr.addColorStop(0,bad?'rgba(248,113,113,.55)':'rgba(253,224,71,.85)');gr.addColorStop(1,'rgba(253,224,71,0)');
      ctx.fillStyle=gr;ctx.beginPath();ctx.arc(o.x,o.y+bob,36*pr,0,7);ctx.fill();
      ctx.save();ctx.translate(o.x,o.y+bob);ctx.scale(pr,pr);ctx.drawImage(im,-o.w/2,-o.h/2,o.w,o.h);ctx.restore();
      if(!bad){ctx.fillStyle='#fff';const a=S.time*3+o.d;for(let i=0;i<3;i++){const aa=a+i*2.1;ctx.fillRect(o.x+Math.cos(aa)*26-1.5,o.y+bob+Math.sin(aa)*26-1.5,3,3)}}
    } else {
      const warn=o.y<(H*.34+260)&&o.y>H*.34-40;
      ctx.save();ctx.shadowColor='#ef4444';ctx.shadowBlur=warn?14+Math.sin(S.time*14)*8:6;
      ctx.drawImage(im,o.x-o.w/2,o.y-o.h/2,o.w,o.h);ctx.restore();
      if(warn){ctx.fillStyle='#fca5a5';ctx.font='900 14px sans-serif';ctx.textAlign='center';ctx.fillText('⚠',o.x,o.y-o.h/2-6)}
    }});
  S.spark.forEach(p=>{ctx.globalAlpha=1-p.t/.6;ctx.fillStyle='#fde68a';ctx.fillRect(p.x-2,p.y-2,4,4)});ctx.globalAlpha=1;
  // diver
  const x=S.dx, y=dy, im=IMG.diver0, w=118, h=w*365/300;
  if(Math.abs(S.tx-S.dx)>14)face=S.tx>S.dx?1:-1;
  if(!(S.inv>0&&Math.floor(S.time*20)%2)&&im.complete){
    ctx.save();ctx.translate(x,y);ctx.scale(face,1);
    ctx.rotate(Math.max(-.35,Math.min(.35,(S.tx-S.dx)*face*.004))+Math.sin(S.time*5)*.03);
    ctx.imageSmoothingEnabled=true;
    ctx.shadowColor=S.dbl>0?'#f472b6':'rgba(125,211,252,.9)';ctx.shadowBlur=S.dbl>0?22:9;
    ctx.drawImage(im,-w*.55,-h*.5,w,h);ctx.restore();
  }
  // popups
  ctx.textAlign='center';ctx.font='900 16px sans-serif';
  S.pop.forEach(p=>{ctx.globalAlpha=1-p.t/1.1;ctx.fillStyle='#000';ctx.fillText(p.txt,p.x+1,p.y-p.t*40+1);ctx.fillStyle=p.col;ctx.fillText(p.txt,p.x,p.y-p.t*40)});ctx.globalAlpha=1;
  if(S.combo>=2){ctx.fillStyle='#fde68a';ctx.font='900 20px sans-serif';ctx.textAlign='center';ctx.fillText('COMBO x'+S.combo,W/2,H-60)}
  if(S.dbl>0){ctx.fillStyle='rgba(244,114,182,.9)';ctx.font='900 14px sans-serif';ctx.fillText('★ DOUBLE '+S.dbl.toFixed(1)+'s',W/2,H-24)}
  ctx.restore();
}
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;

async function api(path,opt){const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,Object.assign({headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'}},opt));if(!r.ok)throw new Error(r.status);return r}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function ranking(el,mine){
  el.innerHTML='<div><span>ランキング読み込み中…</span></div>';
  try{
    const rows=await (await api('game_scores?select=name,depth&order=depth.desc&limit=200')).json();
    const best=new Map();rows.forEach(r=>{if(!best.has(r.name))best.set(r.name,Number(r.depth))});
    const top=[...best.entries()].slice(0,8);
    el.innerHTML='<div style="opacity:.7;font-size:12px"><span>🏆 メンバーランキング(各自のベスト)</span></div>'+(top.map((r,i)=>'<div'+(r[0]===mine?' style="color:#fde68a"':'')+'><span>'+(i+1)+'. '+esc(r[0])+'</span><b>'+r[1].toFixed(0)+'m</b></div>').join('')||'<div><span>まだ記録がありません</span></div>');
  }catch(e){el.innerHTML='<div><span>ランキングを取得できませんでした</span></div>'}

function myName(){return ($('nm').value||'').trim().slice(0,12)}
function bestLocal(){return Number(localStorage.getItem('bh_game_best')||0)}
function startGame(){audioOn();
  const n=myName();if(!n){$('nm').focus();$('nm').style.borderColor='#f87171';return}
  try{localStorage.setItem('bh_game_name',n)}catch(e){}
  reset();state='play';$('start').classList.add('hide');$('end').classList.add('hide');$('hud').classList.remove('hide');
}
async function endGame(){

  $('fin').textContent=Math.floor(depth);
  let nb=false;const b=bestLocal();if(depth>b){nb=true;try{localStorage.setItem('bh_game_best',String(depth))}catch(e){}}
  $('endmsg').textContent=nb?'🎉 自己ベスト更新！':'タイムアップ！';
  $('best').textContent='自己ベスト '+Math.floor(Math.max(b,depth))+'m ／ アイテム '+S.items+'個 ／ 最大コンボ '+S.maxCombo+' ／ ギリギリ '+S.near+'回';
  $('end').classList.remove('hide');
