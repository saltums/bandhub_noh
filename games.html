<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ミニゲーム | Band Hub</title>
  <meta property="og:title" content="nohミニゲーム">
  <meta property="og:description" content="nohメンバーのミニゲーム集">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0b0b14 70%);
      color: #fff; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto;
      padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
    }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .back { color: #c7d2fe; text-decoration: none; font-size: 14px; font-weight: 700; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,.08); }
    h1 { font-size: 20px; font-weight: 900; letter-spacing: .05em; }
    .list { flex: 1; display: grid; grid-template-rows: 1fr 1fr; gap: 14px; min-height: 0; }
    .card {
      position: relative; border-radius: 24px; overflow: hidden; text-decoration: none; color: #fff;
      display: flex; flex-direction: column; justify-content: flex-end; padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.45); transition: transform .12s;
    }
    .card:active { transform: scale(.97); }
    .art { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .title { position: relative; font-size: 26px; font-weight: 900; line-height: 1.1; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
    .sub { position: relative; font-size: 12px; opacity: .85; margin-top: 4px; }
    .play { position: absolute; top: 14px; right: 14px; background: rgba(255,255,255,.92); color: #111; font-weight: 900; font-size: 13px; padding: 6px 14px; border-radius: 999px; }

    /* OGURA the DIVER: 海に潜っていく */
    .diver { background: linear-gradient(180deg, #22d3ee 0%, #0369a1 55%, #0c1e3d 100%); }
    .bubble { position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); animation: rise 4s linear infinite; }
    @keyframes rise { from { transform: translateY(40px); opacity: 0; } 20% { opacity: 1; } to { transform: translateY(-160px); opacity: 0; } }
    .diver-man { font-size: 84px; animation: sink 3s ease-in-out infinite; filter: drop-shadow(0 6px 10px rgba(0,0,0,.4)); }
    @keyframes sink { 0%,100% { transform: translateY(-14px) rotate(-8deg); } 50% { transform: translateY(10px) rotate(8deg); } }
    .gold { position: absolute; bottom: 22%; right: 18%; font-size: 30px; animation: glint 1.6s ease-in-out infinite; }
    @keyframes glint { 0%,100% { opacity: .5; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.1); } }

    /* 一也 劇場版: 暗いライブハウスとスポットライト */
    .kazuya { background: #050505; }
    .spot { position: absolute; top: -20%; left: 50%; width: 120%; height: 140%; transform: translateX(-50%);
      background: radial-gradient(ellipse at 50% 20%, rgba(220,38,38,.55) 0%, rgba(127,29,29,.25) 30%, transparent 60%);
      animation: flicker 2.4s infinite; }
    @keyframes flicker { 0%,100% { opacity: .9; } 45% { opacity: .55; } 48% { opacity: .95; } 52% { opacity: .4; } 60% { opacity: .85; } }
    .eyes { position: relative; display: flex; gap: 26px; animation: stare 5s ease-in-out infinite; }
    .eye { width: 26px; height: 12px; background: #fca5a5; border-radius: 50%; box-shadow: 0 0 16px 4px rgba(248,113,113,.8); }
    @keyframes stare { 0%,40%,100% { transform: scale(1); } 44%,46% { transform: scaleY(.1); } 70% { transform: scale(1.25) translateY(6px); } }
    .kazuya .title { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; letter-spacing: .12em; color: #fecaca; }
    .soon { opacity: .55; pointer-events: none; }
    .soon .play { background: rgba(255,255,255,.3); color: #fff; }
  </style>
</head>
<body>
  <header>
    <a class="back" href="index.html">← アプリへ</a>
    <h1>ミニゲーム</h1>
  </header>

  <div class="list">
    <a class="card diver" href="game.html">
      <div class="art">
        <span class="bubble" style="left:18%;bottom:20%;width:14px;height:14px;animation-delay:0s"></span>
        <span class="bubble" style="left:30%;bottom:10%;width:9px;height:9px;animation-delay:1.3s"></span>
        <span class="bubble" style="right:24%;bottom:30%;width:12px;height:12px;animation-delay:2.2s"></span>
        <span class="diver-man">🤿</span>
        <span class="gold">✨</span>
      </div>
      <span class="play">▶ あそぶ</span>
      <span class="title">OGURA<br>the DIVER</span>
      <span class="sub">15秒でどこまで潜れる?</span>
    </a>

    <a class="card kazuya" id="kazuya" href="https://saltums.github.io/kazuya-gekijoban/">
      <div class="art"><div class="spot"></div><div class="eyes"><span class="eye"></span><span class="eye"></span></div></div>
      <span class="play">▶ あそぶ</span>
      <span class="title">一也 劇場版</span>
      <span class="sub">目をそらすな。物陰に隠れてステージ前へ</span>
    </a>
  </div>

</body>
</html>
