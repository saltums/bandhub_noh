<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>萩の夏休み</title>
<style>
:root{--g:#16a34a;--sky1:#7dd3fc;--sky2:#fef9c3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#fde68a;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:#1f2937;overflow:hidden;touch-action:manipulation}
#app{position:fixed;inset:0;max-width:480px;margin:0 auto;background:linear-gradient(#7dd3fc 0%,#bae6fd 28%,#fef9c3 46%,#bbf7d0 46.1%,#86efac 100%);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px calc(12px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:flex-end;padding:10px 4px 0}
.top small{display:block;font-size:11px;font-weight:700;opacity:.7}
.big{font-size:36px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.wife{margin:8px 0;background:rgba(255,255,255,.75);border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.wife .em{font-size:38px;line-height:1}
.wife .bar{flex:1}
.wife .lb{font-size:12px;font-weight:800;margin-bottom:4px;display:flex;justify-content:space-between}
.gauge{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden}
.gauge i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#f472b6,#fb923c);transition:width .25s}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:10px;min-height:0}
.st{position:relative;border:0;border-radius:20px;background:rgba(255,255,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;color:inherit;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.12);transition:transform .08s,background .15s}
.st:active{transform:scale(.97)}
.st .ic{font-size:44px;line-height:1;filter:grayscale(.7) opacity(.55);transition:filter .15s}
.st .nm{font-size:13px;font-weight:800;opacity:.7}
.st .tk{font-size:12px;font-weight:900;margin-top:2px;min-height:16px}
.st.wait{background:#fff;box-shadow:0 3px 0 #f59e0b,0 0 0 3px #fbbf24 inset;animation:pop .5s ease-out}
.st.wait .ic{filter:none;animation:wob .6s ease-in-out infinite}
.st.wait .nm{opacity:1}
.st.run{background:#dcfce7;box-shadow:0 3px 0 #16a34a}
.st.run .ic{filter:none}
.st.done{animation:done .5s ease-out}
.st.miss{animation:miss .4s}
.st .ttl{position:absolute;left:10px;right:10px;bottom:8px;height:6px;background:rgba(0,0,0,.1);border-radius:9px;overflow:hidden;display:none}
.st.wait .ttl,.st.run .ttl{display:block}
.st .ttl i{display:block;height:100%;background:#f59e0b;width:100%}
.st.run .ttl i{background:#16a34a;width:0}
.st.long::after{content:"じっくり";position:absolute;top:8px;right:10px;font-size:10px;font-weight:900;background:#fed7aa;color:#9a3412;padding:1px 7px;border-radius:99px}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes done{0%{background:#fde047}100%{background:rgba(255,255,255,.55)}}
@keyframes miss{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.me{margin-top:10px;background:rgba(255,255,255,.8);border-radius:16px;padding:8px 12px}
.me .lb{font-size:12px;font-weight:800;margin-bottom:4px;display:flex;justify-content:space-between}
.me .gauge i{background:#38bdf8;transition:none}
.panel{position:absolute;inset:0;background:rgba(14,116,144,.88);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;z-index:5;overflow-y:auto}
.panel.hide{display:none}
.panel h1{margin:0;font-size:34px;line-height:1.15;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.panel h1 small{display:block;font-size:15px;font-weight:800;color:#fde68a;margin-top:6px;letter-spacing:.06em}
.panel p{margin:0;font-size:14px;line-height:1.6;opacity:.95}
.how{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 14px;font-size:13px;line-height:1.6;text-align:left;max-width:340px}
.btn{border:0;border-radius:999px;padding:14px 44px;font:inherit;font-size:20px;font-weight:900;color:#fff;background:linear-gradient(90deg,#f97316,#ef4444);box-shadow:0 5px 0 #9a3412;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #9a3412}
.res{font-size:64px;font-weight:900;line-height:1}
.back2{color:#fff;font-size:13px;font-weight:700;text-decoration:underline;opacity:.9}
.back{position:fixed;left:12px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:9;color:#fff;background:rgba(0,0,0,.4);padding:6px 12px;border-radius:99px;font-size:12px;font-weight:700;text-decoration:none}
.pop{position:absolute;pointer-events:none;font-weight:900;font-size:22px;color:#b45309;text-shadow:0 2px 0 #fff;animation:up .8s ease-out forwards;z-index:3}
@keyframes up{to{transform:translateY(-46px);opacity:0}}
</style></head>
<body>
<div id="app">
  <div class="top"><div><small>のこり</small><span class="big" id="tm">30</span></div><div style="text-align:right"><small>こなしたTODO</small><span class="big" id="sc">0</span></div></div>
  <div class="wife"><div class="em" id="wemo">😴</div><div class="bar"><div class="lb"><span>奥さんの ゆっくり度</span><span id="wmsg">ぐっすり</span></div><div class="gauge"><i id="wg"></i></div></div></div>
  <div class="grid" id="grid"></div>
  <div class="me"><div class="lb"><span>ハギ</span><span id="mst">待機中</span></div><div class="gauge"><i id="mb" style="width:0"></i></div></div>

  <div class="panel" id="start">
    <h1>萩の夏休み<small>〜 伝説の40日 〜</small></h1>
    <p>奥さんの実家に帰省中。<br>奥さんをゆっくり休ませるため、<br>ハギは あらゆるTODOを こなす！</p>
    <div class="how">
      🟡 光ったTODOを<b>タップ</b>で実行<br>
      🍳 <b>じっくり系</b>は、始めたら勝手に進む(3秒)<br>
      ⏱ その間に ほかのTODOを<b>1秒</b>ずつ片付けよう<br>
      ⚠ 放置すると奥さんが動き出して ゆっくり度が減る<br>
      🏁 30秒で いくつこなせる?
    </div>
    <div id="best" style="font-size:13px;opacity:.9"></div>
    <button class="btn" id="go">スタート</button>
    <a class="back2" href="index.html">← アプリへ戻る</a>
  </div>
  <div class="panel hide" id="end">
    <p id="endmsg" style="font-size:18px;font-weight:900">おつかれさま!</p>
    <div class="res"><span id="fin">0</span><span style="font-size:22px"> 個</span></div>
    <p id="endsub"></p>
    <button class="btn" id="again">もう一回</button>
    <a class="back2" href="index.html">← アプリへ戻る</a>
  </div>
</div>
<script>
const LIMIT=30;
const ST=[
 {k:'cook',  nm:'料理',     em:'🍳', dur:3, msg:'ごはん'},
 {k:'wash',  nm:'洗濯',     em:'🧺', dur:3, msg:'せんたく'},
 {k:'bath',  nm:'お風呂',   em:'🛁', dur:2, msg:'おふろ'},
 {k:'clean', nm:'掃除',     em:'🧹', dur:1, msg:'そうじ'},
 {k:'trash', nm:'ゴミ出し', em:'🗑️', dur:1, msg:'ごみ'},
 {k:'weed',  nm:'草むしり', em:'🌿', dur:1, msg:'くさ'}
];
const $=id=>document.getElementById(id);
let G=null,state='idle',last=0,AC=null,muted=false;
const best=()=>{try{return +localStorage.getItem('hagi_best')||0}catch(e){return 0}};
function audioOn(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(f,d,type,v){if(!AC||muted)return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'triangle';o.frequency.value=f;g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sTap=()=>tone(520,.07,'square',.06), sDone=()=>{tone(784,.12,'triangle',.14);setTimeout(()=>tone(1175,.18,'triangle',.12),90)}, sMiss=()=>{tone(150,.25,'sawtooth',.12)}, sStart=()=>tone(330,.08,'square',.06);

function build(){
  const g=$('grid');g.innerHTML='';
  ST.forEach((s,i)=>{const b=document.createElement('button');b.className='st'+(s.dur>1?' long':'');b.id='st'+i;
    b.innerHTML='<div class="ic">'+s.em+'</div><div class="nm">'+s.nm+'</div><div class="tk" id="tk'+i+'"></div><div class="ttl"><i id="tt'+i+'"></i></div>';
    b.addEventListener('pointerdown',e=>{e.preventDefault();tap(i)});g.appendChild(b)});
}
function reset(){
  G={t:LIMIT,time:0,score:0,calm:100,spawn:.5,busy:0,busyMax:1,queued:-1,st:ST.map(s=>({s:'idle',ttl:0,ttlMax:0,prog:0})),miss:0};
  paint();
}
function setCls(i,c){const e=$('st'+i);e.classList.remove('wait','run','done','miss');if(c)e.classList.add(c)}
function popAt(i,txt){const e=$('st'+i),r=e.getBoundingClientRect(),a=$('app').getBoundingClientRect(),p=document.createElement('div');p.className='pop';p.textContent=txt;p.style.left=(r.left-a.left+r.width/2-30)+'px';p.style.top=(r.top-a.top+10)+'px';$('app').appendChild(p);setTimeout(()=>p.remove(),850)}
function paint(){
  ST.forEach((s,i)=>{const x=G.st[i];setCls(i,x.s==='wait'?'wait':x.s==='run'?'run':'');$('tk'+i).textContent=x.s==='wait'?'やって!':x.s==='run'?'進行中…':''});
  $('tm').textContent=Math.ceil(G.t);$('sc').textContent=G.score;
  $('wg').style.width=G.calm+'%';
  $('wemo').textContent=G.calm>66?'😴':G.calm>33?'😌':G.calm>0?'😟':'😵';
  $('wmsg').textContent=G.calm>66?'ぐっすり':G.calm>33?'ちょっと気になる':G.calm>0?'そわそわ…':'動き出した!';
}
function startTask(i){ // ハギが作業を始める
  const x=G.st[i],s=ST[i];
  if(s.dur>1){G.busy=G.busyMax=.5;x.s='run';x.prog=0;x.run=s.dur;G.work=i;}
  else{G.busy=G.busyMax=1;x.s='doing';G.work=i}
}
function tap(i){
  if(state!=='play'){return}
  const x=G.st[i];if(x.s!=='wait')return;
  sTap();
  if(G.busy>0){G.queued=i;return}
  startTask(i);paint();
}
function finish(i){
  const x=G.st[i];x.s='idle';G.score++;sDone();popAt(i,'+1');setCls(i,'done');$('tk'+i).textContent='';
  const e=$('st'+i);e.classList.add('done');setTimeout(()=>e.classList.remove('done'),500);
}
function spawn(){
  const idle=G.st.map((x,i)=>x.s==='idle'?i:-1).filter(i=>i>=0);
  if(!idle.length)return;
  const i=idle[Math.floor(Math.random()*idle.length)],x=G.st[i];
  x.s='wait';x.ttlMax=x.ttl=Math.max(3.6,7.5-G.time*.12);
  const e=$('st'+i);e.classList.remove('wait');void e.offsetWidth;paint();
}
function update(dt){
  G.time+=dt;G.t-=dt;
  // 出現
  G.spawn-=dt;
  if(G.spawn<=0){spawn();G.spawn=Math.max(.55,1.35-G.time*.03)*(.8+Math.random()*.5)}
  // ハギの作業
  if(G.busy>0){G.busy-=dt;
    if(G.busy<=0){G.busy=0;
      const i=G.work;if(i>=0){const x=G.st[i];if(x.s==='doing'){finish(i);G.work=-1}else if(x.s==='run'){G.work=-1}}
      if(G.queued>=0){const q=G.queued;G.queued=-1;if(G.st[q].s==='wait'){startTask(q)}}
      paint()}
  }
  // 進行中(じっくり)
  G.st.forEach((x,i)=>{
    if(x.s==='run'){x.prog+=dt;const r=Math.min(1,x.prog/x.run);$('tt'+i).style.width=(r*100)+'%';if(x.prog>=x.run){finish(i);paint()}}
    else if(x.s==='wait'){x.ttl-=dt;$('tt'+i).style.width=Math.max(0,x.ttl/x.ttlMax*100)+'%';
      if(x.ttl<=0){x.s='idle';G.calm=Math.max(0,G.calm-20);G.miss++;sMiss();const e=$('st'+i);e.classList.add('miss');setTimeout(()=>e.classList.remove('miss'),400);popAt(i,'😡');paint()}}
  });
  $('mb').style.width=G.busy>0?((1-G.busy/G.busyMax)*100)+'%':'0';
  $('mst').textContent=G.busy>0?(G.work>=0?ST[G.work].nm+'中…':'作業中…'):(G.queued>=0?'次: '+ST[G.queued].nm:'待機中');
  $('tm').textContent=Math.max(0,Math.ceil(G.t));$('sc').textContent=G.score;
  if(G.calm<=0||G.t<=0)end(G.calm<=0)
}
function end(woke){
  state='over';paint();
  const b=best(),nb=G.score>b;if(nb){try{localStorage.setItem('hagi_best',String(G.score))}catch(e){}}
  $('fin').textContent=G.score;
  $('endmsg').textContent=woke?'奥さんが動き出しちゃった…':nb?'🎉 自己ベスト更新!':'おつかれさま!';
  $('endsub').textContent=(woke?'':'奥さんは ゆっくり休めました。')+' 自己ベスト '+Math.max(b,G.score)+'個 ／ 見逃し '+G.miss+'回';
  setTimeout(()=>$('end').classList.remove('hide'),woke?600:400);
}
function begin(){audioOn();reset();state='play';$('start').classList.add('hide');$('end').classList.add('hide');sStart()}
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(state==='play')update(dt);requestAnimationFrame(loop)}
build();reset();
$('best').textContent=best()?'自己ベスト '+best()+'個':'';
$('go').addEventListener('click',begin);$('again').addEventListener('click',begin);
requestAnimationFrame(loop);
</script></body></html>
