function title(){ctx.fillStyle='#050a30';ctx.fillRect(0,0,W,H);bg();kazuya();
  txt('和也の必殺技',W/2,150,40,'#fff','center','#2a1a6a');txt('30秒で、対バン相手をなぎ倒せ',W/2,196,15,'#cde','center');

  hand(60,545);win(80,520,W-160,50);txt('もう一回',W/2,545,24,'#fff','center');
  if(!S.fan){S.fan=1;[0,1,2,3,4,5,6].forEach(i=>setTimeout(()=>tone(392*[1,1.25,1.5,1.25,1.5,2,2][i],i===6?.7:.16,'square',.07),i*130))}}
// ---------- ロジック ----------
function startTech(i){S.tech=i;S.phase='dir';S.idx=0;S.seq=[];for(let k=0;k<TECH_LEN[i];k++){let d;do{d=DIRS[Math.floor(Math.random()*4)]}while(k&&d===S.seq[k-1]);S.seq.push(d)}
  if(i===6){S.u7=0;S.gauge=0}sel()}
function fail(msg){S.atb=.4;S.atbDur=.5;ng();S.shake=.25;say(msg||'しっぱい…');S.phase='menu';S.menu='cmd'}
function say(m){S.msg=m;S.msgT=1.1}
function triple(){S.t=Math.min(LIMIT+10,S.t+3);if(S.u7<1)S.gauge=Math.min(1,(S.gauge||0)+.3);S.score+=TECH_PTS[S.tech]*2;
  setTimeout(()=>{[0,1,2].forEach(k=>setTimeout(()=>tone(660*Math.pow(1.26,k),.1,'triangle',.1),k*70))},120);
  S.fx.push({k:'dmg',x:W/2,y:150,s:'TRIPLE！ +3秒',t:0,life:1.3,sz:30});S.flash=.12}
function ultra(){S.ult=1.7;S.ultMax=1.7;S.pk=true;
  const ev=[[0,()=>{noise(.5,.25);tone(110,.9,'sawtooth',.12,880)}],[350,()=>{hit(true);S.flash=.2;S.shake=.4;S.fx.push({k:'slash',x:95,y:265,t:0,life:.4})}],[650,()=>{hit(true);S.flash=.2;S.shake=.4;S.fx.push({k:'slash',x:95,y:250,t:0,life:.4})}],[950,()=>{hit(true);S.flash=.25;S.shake=.5;S.fx.push({k:'slash',x:95,y:280,t:0,life:.4})}],
  [1200,()=>{noise(.7,.4);S.flash=.4;S.shake=.8;addNotes(60,95,265);[0,1,2,3,4,5].forEach(k=>setTimeout(()=>tone(392*[1,1.25,1.5,2,2.5,3][k],.35,'square',.08),k*60));S.fx.push({k:'dmg',x:95,y:200,s:'99999',t:0,life:1.2,sz:60})}]];
  ev.forEach(([ms,f])=>setTimeout(()=>{if(S&&S.ult>0)f()},ms))}
function success(){const i=S.tech,e=S.enemy,pts=TECH_PTS[i];S.swing=.001;S.flash=.15;
  if(i===6){ultra()}else{hit(i>=4)}
  if(i<6){if(S.last===i)S.run++;else S.run=1;S.last=i;if(S.run>=3){S.run=0;triple()}}else{S.last=-1;S.run=0}
  S.dance={i,t:0};S.atb=0;S.atbDur=.4+.13*i;setTop(i===6?'奥義  '+TECH_NAME[6]:TECH_NAME[i]);
  {const lv=i,cols=['#fde047','#7dd3fc','#f9a8d4','#86efac','#fdba74','#c4b5fd','#fff'];
   for(let k=0;k<Math.min(5,1+Math.ceil(lv*.8));k++)S.fx.push({k:'ring',x:300,y:320,t:-k*.09,life:.6+lv*.04,c:cols[(lv+k)%7],r:60+lv*22});
   if(lv>=2)for(let k=0;k<lv*6;k++)S.fx.push({k:'conf',x:300,y:260,vx:(Math.random()-.5)*(200+lv*60),vy:-120-Math.random()*(160+lv*40),t:0,life:.9+Math.random()*.5,c:cols[k%7]});
   if(lv>=3)S.fx.push({k:'dmg',x:300,y:190,s:['','','','いいぞ！','圧巻！','完璧！！'][lv],t:0,life:.9,sz:26+lv*2});
   if(lv>=4)S.flash=Math.max(S.flash,.12+lv*.02);}
  addNotes(8+i*3,95,265);
  S.fx.push({k:'slash',x:95,y:265,t:0,life:.35});S.fx.push({k:'dmg',x:95,y:215,s:String(pts*100+Math.floor(Math.random()*90)),t:0,life:.9,sz:30+i*3});
  S.score+=pts;S.kills++;S.bestTech=Math.max(S.bestTech,i);if(i<6&&S.u7<1){S.gauge=(S.gauge||0)+1/(7-i);if(S.gauge>=.999){S.gauge=1;S.u7=1;say(TECH_NAME[6]+' が使える！')}}
  if(i===6){S.pk=true}else e.die=.001;S.shake=.3;S.phase='menu';S.menu='cmd';
  if(!S.msgT)say(['撃破！','決まった！','見事！'][Math.floor(Math.random()*3)]);S.pending=.55}
let sx=0,sy=0,down=false;
function pos(ev){const r=cv.getBoundingClientRect();return[(ev.clientX-r.left)/r.width*W,(ev.clientY-r.top)/r.height*H]}
cv.addEventListener('pointerdown',ev=>{ev.preventDefault();A();if(ac&&ac.state==='suspended')ac.resume();const[x,y]=pos(ev);sx=x;sy=y;down=true;tap(x,y)});
cv.addEventListener('pointermove',ev=>{if(!down||!S||state!=='play'||S.phase!=='dir')return;const[x,y]=pos(ev),dx=x-sx,dy=y-sy;if(Math.hypot(dx,dy)<20)return;
  const ax=Math.abs(dx),ay=Math.abs(dy);if(Math.max(ax,ay)<Math.min(ax,ay)*1.6){return}   // 斜めは判定保留
  const d=ax>ay?(dx>0?'R':'L'):(dy>0?'D':'U');sx=x;sy=y;
  if(S.idx>0&&d===S.seq[S.idx-1])return;                   // 同じ向きへの行きすぎは無視
  if(d===S.seq[S.idx]){okd(S.idx);S.idx++;if(S.idx>=S.seq.length){S.phase='btn';S.btnT=2}}else fail('ちがう！')});
addEventListener('pointerup',()=>{down=false});
function tap(x,y){
  if(state==='title'){if(y>500&&y<600){reset();state='play'}return}
  if(state==='over'){if(y>490&&y<570){reset();state='play'}return}
  if(S.enemy.die>0||S.ult>0)return;
  if(S.phase==='menu'){
    if(S.menu==='cmd'){if(y>478&&y<770){if(S.atb>=1){S.menu='list';sel()}else ng()}}
    else{for(let i=0;i<7;i++){const col=i%2,row=Math.floor(i/2),bx=14+col*182,by=542+row*52;if(x>bx&&x<bx+182&&y>by&&y<by+52){if(i===6&&S.u7<1){ng();return}S.sel=i;startTech(i);return}}
      if(y<540){S.menu='cmd'}}
  }else if(S.phase==='btn'){
    if(x>W-150&&y>630)success()}
}
let last=0;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;ctx.clearRect(0,0,W,H);
  if(state==='title'){S=S||{time:0,swing:0,shake:0,enemy:{name:'',h:0,shape:0}};S.time+=dt;title()}
  else{S.time+=dt;
    if(state==='play'){if(!(S.ult>0))S.t-=dt;if(S.t<=0){S.t=0;state='over';S.fan=0;if(S.score>best){best=S.score;try{localStorage.setItem('kz_best',best)}catch(e){}}}
      if(S.phase==='btn'){S.btnT-=dt;if(S.btnT<=0)fail('ボタンが遅い！')}}
    if(S.ult>0){S.ult-=dt;if(S.ult<=0&&S.pk){S.pk=false;S.enemy.die=.001}}
    if(S.atb<1&&state==='play'&&!(S.ult>0))S.atb=Math.min(1,S.atb+dt/S.atbDur);if(S.topT>0)S.topT-=dt;if(S.intro>0)S.intro-=dt;
    if(S.msgT>0)S.msgT-=dt;if(S.shake>0)S.shake-=dt;if(S.swing>0){S.swing+=dt*2.2;if(S.swing>=1)S.swing=0}
    if(S.enemy.die>0){S.enemy.die+=dt;if(S.enemy.die>.5&&state==='play'){nextEnemy()}}
    ctx.save();if(S.shake>0)ctx.translate((Math.random()-.5)*5,(Math.random()-.5)*5);bg();enemy(S.enemy);
    if(S.dance){const d=S.dance;d.t+=dt;const p=d.t/DANCE_DUR[d.i];if(p>=1)S.dance=null;else{
      const gh=Math.max(0,d.i-1);for(let g=gh;g>=1;g--){kazuya(danceAt(d.i,p-g*.05),.22)}kazuya(danceAt(d.i,p))}}
    if(!S.dance)kazuya();
    fxDraw(dt);ctx.restore();
    if(S.ult>0)ultFx();
    if(S.flash>0){ctx.fillStyle='rgba(255,255,255,'+S.flash*4+')';ctx.fillRect(0,0,W,470);S.flash-=dt}
    ui();if(S.intro>0)waveFx();if(state==='over')result()}
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);
