<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noh / JointRally ライブ履歴</title>
<link rel="stylesheet" href="common.css">
<style>
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start;padding-bottom:20px}
  @media (max-width:900px){.layout{grid-template-columns:1fr}}
  .filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px}
  @media (max-width:900px){.filters{grid-template-columns:1fr 1fr}.filters .wide{grid-column:1/-1}}
  .filters label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px 2px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
  .bar .sp{flex:1}
  .chk{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}
  .sel{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .tag{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:13px;cursor:pointer}
  .tag b{opacity:.7;font-weight:400}
  .result{margin:18px 2px 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .result strong{font-size:22px;letter-spacing:-.02em}
  .yr{margin:22px 2px 8px;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;gap:10px}
  .yr::after{content:"";flex:1;height:1px;background:var(--line)}
  details.show{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;transition:border-color .15s,box-shadow .15s}
  details.show:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
  details.show[open]{box-shadow:var(--shadow)}
  details.show>summary{cursor:pointer;padding:12px 16px;list-style:none;display:grid;grid-template-columns:86px 1fr auto;gap:12px;align-items:center}
  details.show>summary::-webkit-details-marker{display:none}
  .d{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
  .d small{display:block;font-weight:400;color:var(--muted);font-size:12px}
  .t{font-weight:600;word-break:break-word;line-height:1.4}
  .t small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
  .chev{color:var(--muted);transition:transform .15s}
  details[open] .chev{transform:rotate(90deg)}
  .body{padding:2px 16px 16px 114px;display:grid;grid-template-columns:70px 1fr;gap:8px 12px;margin:0}
  @media (max-width:600px){details.show>summary{grid-template-columns:70px 1fr auto}.body{padding-left:16px}}
  .body dt{color:var(--muted);font-size:13px;padding-top:2px}
  .body dd{margin:0}
  .chip{display:inline-block;padding:2px 10px;margin:0 4px 4px 0;border-radius:999px;background:var(--soft);font-size:13px;cursor:pointer;border:1px solid transparent}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  aside .card{position:sticky;top:72px}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);padding:3px;border-radius:10px;margin-bottom:10px}
  .seg button{border:0;background:transparent;border-radius:8px;padding:6px}
  .seg button.on{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.1);font-weight:600}
  .rank{list-style:none;margin:8px 0 0;padding:0;max-height:560px;overflow:auto}
  .rank li{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;position:relative;font-size:14px}
  .rank li:hover{background:var(--soft)}
  .rank li.on{color:var(--accent);font-weight:600}
  .rank li i{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);opacity:.35;border-radius:2px}
  .rank .n{font-variant-numeric:tabular-nums;color:var(--muted)}
  .empty{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="top" id="top"></div>
<div class="wrap">
  <div class="hero">
    <h1>noh / JointRally ライブ履歴</h1>
    <p id="sub"></p>
  </div>
  <div class="layout">
    <section>
      <div class="card">
        <div class="filters">
          <div class="wide"><label for="q">キーワード</label><input id="q" type="search" placeholder="イベント名・会場・対バン"></div>
          <div><label for="era">時代</label><select id="era"><option value="">すべて</option><option value="noh">noh</option><option value="jointrally">JointRally</option></select></div>
          <div><label for="year">年</label><select id="year"></select></div>
          <div><label for="pref">地域</label><select id="pref"></select></div>
          <div><label for="venue">会場</label><select id="venue"></select></div>
        </div>
        <div class="sel" id="selected"></div>
        <div class="bar">
          <label class="chk"><input type="checkbox" id="up" checked> 今後の予定を含める</label>
          <select id="order" style="width:auto"><option value="desc">新しい順</option><option value="asc">古い順</option></select>
          <span class="sp"></span>
          <button id="open">すべて開く</button><button id="close">閉じる</button><button id="reset">リセット</button>
        </div>
      </div>
      <div class="result" id="result"></div>
      <div id="list"></div>
    </section>
    <aside>
      <div class="card">
        <div class="seg"><button id="tab-act" class="on">対バン</button><button id="tab-venue">会場</button></div>
        <input id="rq" type="search" placeholder="ランキング内を検索">
        <div class="muted" id="rnote" style="font-size:12px;margin-top:8px"></div>
        <ul class="rank" id="rank"></ul>
      </div>
    </aside>
  </div>
  <footer>回数は現在の絞り込み条件に合う公演の中で数えています。出典と未確認の範囲は「データソース」を参照してください。</footer>
</div>
<script src="shows.js"></script>
<script src="common.js"></script>
<script>
window.shows_ready.then(function(){
  mountNav();
  const S = window.SHOWS.slice();
  const P = new URLSearchParams(location.search);
  const state = {q:P.get("q")||"", year:P.get("year")||"", era:P.get("era")||"", pref:P.get("pref")||"", venue:P.get("venue")||"", acts:new Set(P.getAll("act")), up:true, order:"desc", tab:"act", rq:""};
  const $ = id => document.getElementById(id);
  const uniq = a => [...new Set(a)];
  const WD = ["日","月","火","水","木","金","土"];
  const fill = (el,label,vals) => el.innerHTML = '<option value="">'+label+'</option>'+vals.map(v=>'<option>'+esc(v)+'</option>').join("");
  fill($("year"),"すべて",uniq(S.map(s=>s.date.slice(0,4))).sort().reverse());
  fill($("pref"),"すべて",uniq(S.map(s=>s.pref)).sort());
  fill($("venue"),"すべて",uniq(S.map(s=>s.venue)).sort((a,b)=>a.localeCompare(b,"ja")));
  ["q","year","era","pref","venue"].forEach(k=>$(k).value=state[k]);

  const matches = s => {
    if(!state.up && s.upcoming) return false;
    if(state.year && s.date.slice(0,4)!==state.year) return false;
    if(state.era && s.era!==state.era) return false;
    if(state.pref && s.pref!==state.pref) return false;
    if(state.venue && s.venue!==state.venue) return false;
    for(const a of state.acts) if(!s.acts.includes(a)) return false;
    if(state.q){
      const hay=(s.title+" "+s.venue+" "+s.pref+" "+s.acts.join(" ")+" "+s.note).toLowerCase();
      for(const w of state.q.toLowerCase().split(/\s+/).filter(Boolean)) if(!hay.includes(w)) return false;
    }
    return true;
  };

  function render(){
    const list = S.filter(matches).sort((a,b)=>state.order==="desc"?b.date.localeCompare(a.date):a.date.localeCompare(b.date));
    const pl = played();
    $("sub").textContent = pl.length+"公演の記録 ・ "+pl[pl.length-1].date.slice(0,4)+"年〜"+pl[0].date.slice(0,4)+"年(JointRally "+pl.filter(s=>s.era==="jointrally").length+" / noh "+pl.filter(s=>s.era==="noh").length+")";

    $("selected").innerHTML = [...state.acts].map(a=>'<span class="tag" data-act="'+esc(a)+'">'+esc(a)+' <b>✕</b></span>').join("");

    let head = '<strong>'+list.length+'</strong><span class="muted">公演</span>';
    if(state.acts.size && list.length){
      const ds=list.map(s=>s.date).sort();
      head += '<span class="muted">初 '+fmtDate(ds[0])+' ・ 最新 '+fmtDate(ds[ds.length-1])+'</span>';
    }
    $("result").innerHTML = head;

    let lastY="";
    $("list").innerHTML = list.length ? list.map(s=>{
      const y=s.date.slice(0,4); let h="";
      if(y!==lastY){h='<div class="yr">'+y+'</div>';lastY=y}
      const dt=new Date(s.date+"T00:00:00");
      const time=(s.open||s.start)?("OPEN "+(s.open||"-")+" / START "+(s.start||"-")):"未記載";
      const tags=(s.upcoming?'<span class="pill warn">予定</span>':'')+(s.era==="jointrally"?'<span class="pill jr">JointRally</span>':'');
      return h+'<details class="show"><summary><span class="d">'+fmtDate(s.date.slice(5))+'<small>'+WD[dt.getDay()]+'曜</small></span>'+
        '<span class="t">'+esc(s.title)+'<small>'+esc(s.venue)+(s.pref!=="愛知"?' ・ '+esc(s.pref):'')+'</small></span><span>'+tags+' <span class="chev">›</span></span></summary>'+
        '<dl class="body"><dt>対バン</dt><dd>'+(s.acts.length?s.acts.map(a=>'<span class="chip'+(state.acts.has(a)?' on':'')+'" data-act="'+esc(a)+'">'+esc(a)+'</span>').join(""):'<span class="muted">未確認</span>')+'</dd>'+
        '<dt>時間</dt><dd>'+esc(time)+'</dd><dt>料金</dt><dd>'+(s.price?esc(s.price):'<span class="muted">未記載</span>')+'</dd>'+
        (s.note?'<dt>備考</dt><dd>'+esc(s.note)+'</dd>':'')+'</dl></details>';
    }).join("") : '<div class="empty">条件に合う公演がありません</div>';

    const isAct=state.tab==="act";
    let rows=isAct?countBy(list,s=>s.acts):countBy(list,s=>[s.venue]);
    if(state.rq) rows=rows.filter(r=>r.k.toLowerCase().includes(state.rq.toLowerCase()));
    const max=rows.length?rows[0].n:1;
    $("rnote").textContent=isAct?"共演回数(現在の絞り込み内)":"出演回数(現在の絞り込み内)";
    $("rank").innerHTML=rows.map(r=>{
      const on=isAct?state.acts.has(r.k):state.venue===r.k;
      return '<li class="'+(on?"on":"")+'" data-'+(isAct?"act":"venue")+'="'+esc(r.k)+'"><span>'+esc(r.k)+'</span><span class="n">'+r.n+'</span><i style="width:'+Math.round(r.n/max*100)+'%"></i></li>';
    }).join("")||'<li class="muted">該当なし</li>';
    $("tab-act").classList.toggle("on",isAct);$("tab-venue").classList.toggle("on",!isAct);
  }

  document.addEventListener("click",e=>{
    const t=e.target.closest("[data-act],[data-venue]"); if(!t) return;
    if(t.dataset.act!==undefined){e.preventDefault();const a=t.dataset.act;state.acts.has(a)?state.acts.delete(a):state.acts.add(a);render()}
    else{state.venue=state.venue===t.dataset.venue?"":t.dataset.venue;$("venue").value=state.venue;render()}
  });
  const bind=(id,key,ev)=>$(id).addEventListener(ev||"change",e=>{state[key]=e.target.value.trim();render()});
  bind("q","q","input");bind("rq","rq","input");bind("year","year");bind("era","era");bind("pref","pref");bind("venue","venue");bind("order","order");
  $("up").addEventListener("change",e=>{state.up=e.target.checked;render()});
  $("tab-act").onclick=()=>{state.tab="act";render()};$("tab-venue").onclick=()=>{state.tab="venue";render()};
  $("open").onclick=()=>document.querySelectorAll("details.show").forEach(d=>d.open=true);
  $("close").onclick=()=>document.querySelectorAll("details.show").forEach(d=>d.open=false);
  $("reset").onclick=()=>{Object.assign(state,{q:"",year:"",era:"",pref:"",venue:"",up:true,rq:""});state.acts.clear();["q","rq","year","era","pref","venue"].forEach(i=>$(i).value="");$("up").checked=true;render()};
  render();
});;
</script>
</body>
</html>
